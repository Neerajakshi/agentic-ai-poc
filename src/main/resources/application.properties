spring.application.name=agentic-ai-openai-poc
server.port=8080

# OpenAI API key. Set this as an environment variable; do NOT hard-code your key here.
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Model used by the POC. Spring AI 2.0.1 supports gpt-5-mini.
spring.ai.openai.chat.model=gpt-5-mini

# Useful while learning: shows Spring AI operations in the console.
logging.level.org.springframework.ai=DEBUG
